<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920">
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .lane-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .box-text { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .note { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .android { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .ffi { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .rust { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
      .network { fill: #fef2f2; stroke: #ef4444; stroke-width: 1.5; }
      .event { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; }
      .num-circle { fill: #111827; stroke: #ffffff; stroke-width: 2; }
      .num-text { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .loop { stroke: #7c3aed; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#purple-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="#ffffff"/>
  <text class="title" x="48" y="48">Android MQTT over QUIC Connect 调用链</text>
  <text class="note" x="48" y="76">no-IO QUIC/MQTT 状态机：Rust 产生 datagram 和事件，Android Kotlin 负责 UDP socket 收发与 tick 驱动。</text>

  <rect class="lane" x="40" y="110" width="280" height="690" rx="10"/>
  <rect class="lane" x="350" y="110" width="280" height="690" rx="10"/>
  <rect class="lane" x="660" y="110" width="280" height="690" rx="10"/>
  <rect class="lane" x="970" y="110" width="270" height="690" rx="10"/>

  <text class="lane-title" x="64" y="142">Android / Kotlin</text>
  <text class="lane-title" x="374" y="142">UniFFI / FFI</text>
  <text class="lane-title" x="684" y="142">Rust QUIC + MQTT Engine</text>
  <text class="lane-title" x="994" y="142">Network / Broker</text>

  <rect class="android" x="64" y="170" width="232" height="78" rx="8"/>
  <circle class="num-circle" cx="78" cy="184" r="14"/>
  <text class="num-text" x="78" y="184">1</text>
  <text class="box-title" x="82" y="198">Start 按钮</text>
  <text class="box-text" x="82" y="220">QuicStabilityRunner.start()</text>
  <text class="small" x="82" y="238">每个 client 一个 runClient(index)</text>

  <rect class="android" x="64" y="285" width="232" height="90" rx="8"/>
  <circle class="num-circle" cx="78" cy="299" r="14"/>
  <text class="num-text" x="78" y="299">2</text>
  <text class="box-title" x="82" y="313">构造参数</text>
  <text class="box-text" x="82" y="335">MqttOptionsFfi(...)</text>
  <text class="box-text" x="82" y="354">MqttTlsOptionsFfi(...)</text>

  <rect class="ffi" x="374" y="285" width="232" height="90" rx="8"/>
  <circle class="num-circle" cx="388" cy="299" r="14"/>
  <text class="num-text" x="388" y="299">3</text>
  <text class="box-title" x="392" y="313">创建 FFI Engine</text>
  <text class="box-text" x="392" y="335">QuicMqttEngineFfi(opts)</text>
  <text class="small" x="392" y="354">UniFFI 调 Rust constructor</text>

  <rect class="rust" x="684" y="285" width="232" height="90" rx="8"/>
  <circle class="num-circle" cx="698" cy="299" r="14"/>
  <text class="num-text" x="698" y="299">4</text>
  <text class="box-title" x="702" y="313">QuicMqttEngineFFI::new</text>
  <text class="box-text" x="702" y="335">MqttClientOptions::builder()</text>
  <text class="box-text" x="702" y="354">QuicMqttEngine::new(options)</text>

  <rect class="android" x="64" y="415" width="232" height="96" rx="8"/>
  <circle class="num-circle" cx="78" cy="429" r="14"/>
  <text class="num-text" x="78" y="429">5</text>
  <text class="box-title" x="82" y="443">打开 UDP Channel</text>
  <text class="box-text" x="82" y="465">DatagramChannel.open()</text>
  <text class="box-text" x="82" y="484">configureBlocking(false)</text>
  <text class="box-text" x="82" y="503">connect(brokerAddr)</text>

  <rect class="android" x="64" y="550" width="232" height="86" rx="8"/>
  <circle class="num-circle" cx="78" cy="564" r="14"/>
  <text class="num-text" x="78" y="564">6</text>
  <text class="box-title" x="82" y="578">触发连接</text>
  <text class="box-text" x="82" y="600">engine.connect(serverAddr,</text>
  <text class="box-text" x="82" y="619">serverName, tlsOpts, nowMs)</text>

  <rect class="ffi" x="374" y="550" width="232" height="96" rx="8"/>
  <circle class="num-circle" cx="388" cy="564" r="14"/>
  <text class="num-text" x="388" y="564">7</text>
  <text class="box-title" x="392" y="578">QuicMqttEngineFFI::connect</text>
  <text class="box-text" x="392" y="600">构造 rustls ClientConfig</text>
  <text class="box-text" x="392" y="619">Android: platform verifier</text>
  <text class="box-text" x="392" y="638">ALPN 默认 mqtt</text>

  <rect class="rust" x="684" y="550" width="232" height="96" rx="8"/>
  <circle class="num-circle" cx="698" cy="564" r="14"/>
  <text class="num-text" x="698" y="564">8</text>
  <text class="box-title" x="702" y="578">QuicMqttEngine::connect</text>
  <text class="box-text" x="702" y="600">quinn-proto Endpoint.connect()</text>
  <text class="box-text" x="702" y="619">创建 QUIC 连接状态</text>
  <text class="small" x="702" y="638">此处还没有真正写 UDP socket</text>

  <rect class="android" x="64" y="685" width="232" height="84" rx="8"/>
  <circle class="num-circle" cx="78" cy="699" r="14"/>
  <text class="num-text" x="78" y="699">9</text>
  <text class="box-title" x="82" y="713">首次驱动并发送</text>
  <text class="box-text" x="82" y="735">engine.handleTick(nowMs)</text>
  <text class="box-text" x="82" y="754">sendOutgoing(engine, channel)</text>

  <rect class="rust" x="684" y="685" width="232" height="84" rx="8"/>
  <circle class="num-circle" cx="698" cy="699" r="14"/>
  <text class="num-text" x="698" y="699">10</text>
  <text class="box-title" x="702" y="713">生成 QUIC datagrams</text>
  <text class="box-text" x="702" y="735">conn.poll_transmit(...)</text>
  <text class="box-text" x="702" y="754">take_outgoing_datagrams()</text>

  <rect class="network" x="994" y="685" width="222" height="84" rx="8"/>
  <circle class="num-circle" cx="1008" cy="699" r="14"/>
  <text class="num-text" x="1008" y="699">11</text>
  <text class="box-title" x="1012" y="713">UDP 发往 Broker</text>
  <text class="box-text" x="1012" y="735">DatagramChannel.write()</text>
  <text class="box-text" x="1012" y="754">QUIC Initial / Handshake</text>

  <path class="arrow" d="M 180 248 L 180 285"/>
  <path class="arrow" d="M 296 330 L 374 330"/>
  <path class="arrow" d="M 606 330 L 684 330"/>
  <path class="arrow" d="M 180 375 L 180 415"/>
  <path class="arrow" d="M 180 511 L 180 550"/>
  <path class="arrow" d="M 296 593 L 374 593"/>
  <path class="arrow" d="M 606 598 L 684 598"/>
  <path class="arrow" d="M 180 636 L 180 685"/>
  <path class="dashed" d="M 296 727 L 684 727"/>
  <path class="dashed" d="M 916 727 L 994 727"/>

  <rect class="event" x="360" y="815" width="560" height="64" rx="8"/>
  <circle class="num-circle" cx="374" cy="829" r="14"/>
  <text class="num-text" x="374" y="829">12</text>
  <text class="box-title" x="382" y="842">连接完成后的循环</text>
  <text class="box-text" x="382" y="864">receive UDP -> handleDatagram() -> handleTick() -> MQTT/QUIC events -> sendOutgoing()</text>

  <path class="loop" d="M 1105 685 C 1110 620, 1030 585, 916 610"/>
  <path class="loop" d="M 684 735 C 560 805, 395 800, 296 735"/>
  <path class="loop" d="M 640 815 C 640 775, 655 755, 684 745"/>

  <rect class="rust" x="684" y="165" width="232" height="86" rx="8"/>
  <circle class="num-circle" cx="698" cy="179" r="14"/>
  <text class="num-text" x="698" y="179">13</text>
  <text class="box-title" x="702" y="193">QUIC Connected 事件</text>
  <text class="box-text" x="702" y="215">open bidirectional stream</text>
  <text class="box-text" x="702" y="234">mqtt_engine.connect()</text>

  <rect class="rust" x="994" y="165" width="222" height="86" rx="8"/>
  <circle class="num-circle" cx="1008" cy="179" r="14"/>
  <text class="num-text" x="1008" y="179">14</text>
  <text class="box-title" x="1012" y="193">MQTT CONNECT</text>
  <text class="box-text" x="1012" y="215">MqttEngine 生成 CONNECT</text>
  <text class="box-text" x="1012" y="234">写入 QUIC bidirectional stream</text>

  <path class="dashed" d="M 800 550 C 800 470, 800 330, 800 251"/>
  <path class="arrow" d="M 916 208 L 994 208"/>

  <rect class="event" x="994" y="285" width="222" height="90" rx="8"/>
  <circle class="num-circle" cx="1008" cy="299" r="14"/>
  <text class="num-text" x="1008" y="299">15</text>
  <text class="box-title" x="1012" y="313">CONNACK 返回</text>
  <text class="box-text" x="1012" y="335">UDP -> QUIC stream</text>
  <text class="box-text" x="1012" y="354">mqtt_engine.handle_incoming()</text>

  <rect class="event" x="684" y="415" width="232" height="96" rx="8"/>
  <circle class="num-circle" cx="698" cy="429" r="14"/>
  <text class="num-text" x="698" y="429">16</text>
  <text class="box-title" x="702" y="443">Connected 事件给 Android</text>
  <text class="box-text" x="702" y="465">MqttEventFfi.Connected</text>
  <text class="box-text" x="702" y="484">stats.connected++</text>
  <text class="small" x="702" y="503">连接耗时在 Kotlin 侧统计</text>

  <path class="loop" d="M 1105 685 C 1180 570, 1180 430, 1105 375"/>
  <path class="arrow" d="M 994 330 L 916 450"/>

  <text class="small" x="48" y="890">源码入口：kotlin/examples/android_quic_stability/src/main/kotlin/.../MainActivity.kt；FFI：flowsdk_ffi/src/engine.rs；核心状态机：src/mqtt_client/engine.rs</text>
</svg>
